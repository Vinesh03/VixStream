name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS platform (generato in CI - ios/ gitignored)
        run: npx cap add ios

      - name: Sync iOS (pod install incluso)
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build build

      - name: Package unsigned ipa
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../VixStream-iOS-unsigned.ipa Payload
          ls -la ../../VixStream-iOS-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VixStream-iOS-unsigned
          path: VixStream-iOS-unsigned.ipa
          retention-days: 30
