server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: le rotte react (/movies, /details/...) devono servire index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lunga per gli asset con hash (cambiano solo a ogni build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Compressione gzip per js/css
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
